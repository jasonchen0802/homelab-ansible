---
- name: Load OS-specific package variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

# ============================================
# Debian / Ubuntu Utility Package Installation
# ============================================
- name: "[BLOCK] ---------- Install Debian-based System Utilities ----------"
  when: ansible_facts['os_family'] == "Debian"
  become: true
  block:
    - name: Install base utilities and agents via apt
      ansible.builtin.apt:
        name: "{{ common_essential_packages }}"
        state: present

# ===========================================
# macOS (Darwin) Utility Package Installation
# ===========================================
- name: "[BLOCK] ---------- Install macOS Development Tools ----------"
  when: ansible_facts['os_family'] == "Darwin"
  block:
    - name: Install base utilities via Homebrew
      community.general.homebrew:
        name: "{{ common_essential_packages }}"
        state: present

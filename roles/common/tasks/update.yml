---
# =======================================
# Debian / Ubuntu Linux System OS Upgrade
# =======================================
- name: "[BLOCK] ---------- Perform Debian-based system upgrade ----------"
  when: ansible_facts['os_family'] == "Debian"
  become: true
  block:
    - name: Ensure cloud-init has fully finished (Prevents apt race conditions)
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
      async: 30
      poll: 5

    - name: Update apt cache and upgrade all packages to latest version
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        cache_valid_time: 3600

# =======================================
# macOS (Darwin) System Homebrew Upgrade
# =======================================
- name: "[BLOCK] ---------- Perform macOS Homebrew upgrade ----------"
  when: ansible_facts['os_family'] == "Darwin"
  block:
    - name: Update Homebrew and upgrade all installed formulas
      community.general.homebrew:
        update_homebrew: true
        upgrade_all: true
